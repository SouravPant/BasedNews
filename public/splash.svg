<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0052ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#003db3;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bgGradient)"/>
  
  <!-- Main logo/text -->
  <text x="600" y="350" font-family="Arial Black, sans-serif" font-size="72" font-weight="900" text-anchor="middle" fill="#ffffff">BasedNews</text>
  <text x="600" y="420" font-family="Arial, sans-serif" font-size="32" text-anchor="middle" fill="#ffffff" opacity="0.9">Base Ecosystem News and Crypto Tracker</text>
  
  <!-- Decorative elements -->
  <circle cx="200" cy="200" r="4" fill="#ffffff" opacity="0.6"/>
  <circle cx="1000" cy="150" r="6" fill="#ffffff" opacity="0.4"/>
  <circle cx="150" cy="600" r="3" fill="#ffffff" opacity="0.5"/>
  <circle cx="1050" cy="650" r="5" fill="#ffffff" opacity="0.7"/>
  
  <!-- Bottom tagline -->
  <text x="600" y="600" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#ffffff" opacity="0.8">Real-time crypto news and market data</text>
</svg>