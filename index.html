<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>BasedNews - Base Ecosystem News</title>
    <meta name="description" content="Real-time crypto news, market data, and Base ecosystem tracking" />
    
    <!-- Farcaster Mini App Meta Tags -->
    <meta property="fc:frame" content="vNext" />
    <meta property="fc:miniapp" content="v1" />
    <meta property="fc:frame:image" content="https://based-news-eight.vercel.app/screenshot1.png" />
    <meta property="fc:frame:button:1" content="Open BasedNews" />
    <meta property="fc:frame:button:1:action" content="link" />
    <meta property="fc:frame:button:1:target" content="https://based-news-eight.vercel.app" />
    
    <!-- Enhanced Open Graph Meta Tags for Farcaster URL Embeds -->
    <meta property="og:title" content="BasedNews - Base Ecosystem News" />
    <meta property="og:description" content="Real-time crypto news, market data, and Base ecosystem tracking. Stay updated with the latest developments in the Base ecosystem." />
    <meta property="og:image" content="https://based-news-eight.vercel.app/screenshot1.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="BasedNews - Base Ecosystem News Platform" />
    <meta property="og:url" content="https://based-news-eight.vercel.app" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BasedNews" />
    <meta property="og:locale" content="en_US" />
    
    <!-- Twitter Card Meta Tags (Farcaster follows these standards) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BasedNews - Base Ecosystem News" />
    <meta name="twitter:description" content="Real-time crypto news, market data, and Base ecosystem tracking. Stay updated with the latest developments in the Base ecosystem." />
    <meta name="twitter:image" content="https://based-news-eight.vercel.app/screenshot1.png" />
    <meta name="twitter:image:alt" content="BasedNews - Base Ecosystem News Platform" />
    
    <!-- Additional Meta Tags for Better Embed Support -->
    <meta name="theme-color" content="#000000" />
    <meta name="msapplication-TileColor" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Farcaster Ready Signal via PostMessage -->
    <script>
      // Send ready signal immediately and on load
      function sendFarcasterReady() {
        if (window.parent && window.parent !== window) {
          console.log('🎯 Sending Farcaster ready signal...');
          try {
            window.parent.postMessage({ type: 'sdk.ready', data: {} }, '*');
            window.parent.postMessage({ type: 'frame.ready', data: {} }, '*');
            window.parent.postMessage({ type: 'sdk_ready' }, '*');
            window.parent.postMessage({ type: 'miniapp-ready' }, '*');
            console.log('✅ Ready signals sent successfully');
          } catch (e) {
            console.warn('Ready signal error:', e);
          }
        }
      }
      
      // Send immediately
      sendFarcasterReady();
      
      // Send on load
      window.addEventListener('load', sendFarcasterReady);
      
      // Send with delays
      setTimeout(sendFarcasterReady, 100);
      setTimeout(sendFarcasterReady, 500);
      setTimeout(sendFarcasterReady, 1000);
    </script>
  </body>
</html>
